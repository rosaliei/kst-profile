<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="712" viewBox="0 0 1250 712" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar-browser" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#4285F4"/></marker>
    <marker id="ar-gateway" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#34A853"/></marker>
    <marker id="ar-keycloak" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#EA4335"/></marker>
    <marker id="ar-backend" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#F9AB00"/></marker>
    <marker id="ar-mysql" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#8E24AA"/></marker>
    <marker id="ar-mail" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#00838F"/></marker>
    <marker id="ar-grey" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#9aa0a6"/></marker>
  </defs>
  <rect x="0" y="0" width="1250" height="712" fill="#ffffff"/>
  <text x="625" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">Flow 6 — Reactivate</text>
  <text x="625" y="64" text-anchor="middle" font-size="13" fill="#666">A deactivated user can still authenticate — they simply cannot do anything except reactivate.</text>
  <rect x="22" y="86" width="176" height="58" rx="10" fill="#E8F0FE" stroke="#4285F4"/>
  <text x="110" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#174ea6">BROWSER</text>
  <text x="110" y="127" text-anchor="middle" font-size="10.5" fill="#3c4043">React SPA + sessionStorage</text>
  <line x1="110" y1="144" x2="110" y2="672" stroke="#dadce0" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="280" y="86" width="176" height="58" rx="10" fill="#E6F4EA" stroke="#34A853"/>
  <text x="368" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#137333">API GATEWAY</text>
  <text x="368" y="127" text-anchor="middle" font-size="10.5" fill="#3c4043">nginx + njs</text>
  <line x1="368" y1="144" x2="368" y2="672" stroke="#dadce0" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="537" y="86" width="176" height="58" rx="10" fill="#FCE8E6" stroke="#EA4335"/>
  <text x="625" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a50e0e">KEYCLOAK</text>
  <text x="625" y="127" text-anchor="middle" font-size="10.5" fill="#3c4043">identity + credentials</text>
  <line x1="625" y1="144" x2="625" y2="672" stroke="#dadce0" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="794" y="86" width="176" height="58" rx="10" fill="#FEF7E0" stroke="#F9AB00"/>
  <text x="882" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b06000">SHOP-SERVICE</text>
  <text x="882" y="127" text-anchor="middle" font-size="10.5" fill="#3c4043">Node backend</text>
  <line x1="882" y1="144" x2="882" y2="672" stroke="#dadce0" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="1052" y="86" width="176" height="58" rx="10" fill="#F3E8FD" stroke="#8E24AA"/>
  <text x="1140" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6a1b9a">MySQL</text>
  <text x="1140" y="127" text-anchor="middle" font-size="10.5" fill="#3c4043">shop data</text>
  <line x1="1140" y1="144" x2="1140" y2="672" stroke="#dadce0" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="110" y1="182" x2="368" y2="182" stroke="#34A853" stroke-width="1.8" marker-end="url(#ar-gateway)"/>
  <text x="239" y="174" text-anchor="middle" font-size="11.5" fill="#3c4043">user logs back in normally</text>
  <text x="239" y="195" text-anchor="middle" font-size="10" fill="#80868b">Keycloak was never disabled for social/OTP</text>
  <circle cx="121" cy="182" r="9.5" fill="#5f6368"/>
  <text x="121" y="186" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">1</text>
  <line x1="110" y1="222" x2="368" y2="222" stroke="#34A853" stroke-width="1.8" marker-end="url(#ar-gateway)"/>
  <text x="239" y="214" text-anchor="middle" font-size="11.5" fill="#3c4043">GET /api/me</text>
  <circle cx="121" cy="222" r="9.5" fill="#5f6368"/>
  <text x="121" y="226" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">2</text>
  <line x1="882" y1="262" x2="110" y2="262" stroke="#9aa0a6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar-grey)"/>
  <text x="496" y="254" text-anchor="middle" font-size="11.5" fill="#3c4043">403 account_deactivated</text>
  <circle cx="872" cy="262" r="9.5" fill="#5f6368"/>
  <text x="872" y="266" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">3</text>
  <path d="M110,292 h34 v18 h-34" fill="none" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#ar-grey)"/>
  <text x="152" y="290" font-size="11.5" fill="#3c4043">setDeactivated(true)</text>
  <text x="152" y="304" font-size="10" fill="#80868b">reactivation screen replaces the shop</text>
  <circle cx="94" cy="298" r="9.5" fill="#5f6368"/>
  <text x="94" y="302" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">4</text>
  <line x1="110" y1="342" x2="368" y2="342" stroke="#34A853" stroke-width="1.8" marker-end="url(#ar-gateway)"/>
  <text x="239" y="334" text-anchor="middle" font-size="11.5" fill="#3c4043">POST /api/account/reactivate</text>
  <text x="239" y="355" text-anchor="middle" font-size="10" fill="#80868b">user taps “Reactivate my account”</text>
  <circle cx="121" cy="342" r="9.5" fill="#5f6368"/>
  <text x="121" y="346" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">5</text>
  <path d="M368,372 h34 v18 h-34" fill="none" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#ar-grey)"/>
  <text x="410" y="370" font-size="11.5" fill="#3c4043">auth_request /_jwt_verify</text>
  <text x="410" y="384" font-size="10" fill="#80868b">the token is valid — only policy blocked it</text>
  <circle cx="352" cy="378" r="9.5" fill="#5f6368"/>
  <text x="352" y="382" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">6</text>
  <line x1="368" y1="422" x2="625" y2="422" stroke="#EA4335" stroke-width="1.8" marker-end="url(#ar-keycloak)"/>
  <text x="496" y="414" text-anchor="middle" font-size="11.5" fill="#3c4043">adminToken() → kcSetEnabled(true)</text>
  <text x="496" y="435" text-anchor="middle" font-size="10" fill="#80868b">no-op for social/OTP</text>
  <circle cx="378" cy="422" r="9.5" fill="#5f6368"/>
  <text x="378" y="426" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">7</text>
  <line x1="368" y1="462" x2="882" y2="462" stroke="#F9AB00" stroke-width="1.8" marker-end="url(#ar-backend)"/>
  <text x="625" y="454" text-anchor="middle" font-size="11.5" fill="#3c4043">POST /internal/customer/status</text>
  <text x="625" y="475" text-anchor="middle" font-size="10" fill="#80868b">NOTE: internal route is not introspected</text>
  <circle cx="378" cy="462" r="9.5" fill="#5f6368"/>
  <text x="378" y="466" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">8</text>
  <line x1="882" y1="502" x2="1140" y2="502" stroke="#8E24AA" stroke-width="1.8" marker-end="url(#ar-mysql)"/>
  <text x="1011" y="494" text-anchor="middle" font-size="11.5" fill="#3c4043">status = 'active'</text>
  <circle cx="894" cy="502" r="9.5" fill="#5f6368"/>
  <text x="894" y="506" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">9</text>
  <line x1="368" y1="542" x2="110" y2="542" stroke="#9aa0a6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar-grey)"/>
  <text x="239" y="534" text-anchor="middle" font-size="11.5" fill="#3c4043">{"ok":true}</text>
  <circle cx="356" cy="542" r="9.5" fill="#5f6368"/>
  <text x="356" y="546" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">10</text>
  <line x1="110" y1="582" x2="882" y2="582" stroke="#F9AB00" stroke-width="1.8" marker-end="url(#ar-backend)"/>
  <text x="496" y="574" text-anchor="middle" font-size="11.5" fill="#3c4043">GET /api/me — passes the gate</text>
  <text x="496" y="595" text-anchor="middle" font-size="10" fill="#80868b">shop returns with cart + orders intact</text>
  <circle cx="121" cy="582" r="9.5" fill="#5f6368"/>
  <text x="121" y="586" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">11</text>
</svg>
