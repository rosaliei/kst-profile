<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="712" viewBox="0 0 1250 712" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar-browser" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#4285F4"/></marker>
    <marker id="ar-gateway" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#34A853"/></marker>
    <marker id="ar-keycloak" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#EA4335"/></marker>
    <marker id="ar-backend" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#F9AB00"/></marker>
    <marker id="ar-mysql" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#8E24AA"/></marker>
    <marker id="ar-mail" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#00838F"/></marker>
    <marker id="ar-grey" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#9aa0a6"/></marker>
  </defs>
  <rect x="0" y="0" width="1250" height="712" fill="#ffffff"/>
  <text x="625" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">Flow 5 — Deactivate (self-pause)</text>
  <text x="625" y="64" text-anchor="middle" font-size="13" fill="#666">The real gate is the MySQL status: it blocks every future /api/* call instantly, even while the token is still valid.</text>
  <rect x="22" y="86" width="176" height="58" rx="10" fill="#E8F0FE" stroke="#4285F4"/>
  <text x="110" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#174ea6">BROWSER</text>
  <text x="110" y="127" text-anchor="middle" font-size="10.5" fill="#3c4043">React SPA + sessionStorage</text>
  <line x1="110" y1="144" x2="110" y2="672" stroke="#dadce0" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="280" y="86" width="176" height="58" rx="10" fill="#E6F4EA" stroke="#34A853"/>
  <text x="368" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#137333">API GATEWAY</text>
  <text x="368" y="127" text-anchor="middle" font-size="10.5" fill="#3c4043">nginx + njs</text>
  <line x1="368" y1="144" x2="368" y2="672" stroke="#dadce0" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="537" y="86" width="176" height="58" rx="10" fill="#FCE8E6" stroke="#EA4335"/>
  <text x="625" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a50e0e">KEYCLOAK</text>
  <text x="625" y="127" text-anchor="middle" font-size="10.5" fill="#3c4043">identity + credentials</text>
  <line x1="625" y1="144" x2="625" y2="672" stroke="#dadce0" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="794" y="86" width="176" height="58" rx="10" fill="#FEF7E0" stroke="#F9AB00"/>
  <text x="882" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b06000">SHOP-SERVICE</text>
  <text x="882" y="127" text-anchor="middle" font-size="10.5" fill="#3c4043">Node backend</text>
  <line x1="882" y1="144" x2="882" y2="672" stroke="#dadce0" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="1052" y="86" width="176" height="58" rx="10" fill="#F3E8FD" stroke="#8E24AA"/>
  <text x="1140" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6a1b9a">MySQL</text>
  <text x="1140" y="127" text-anchor="middle" font-size="10.5" fill="#3c4043">shop data</text>
  <line x1="1140" y1="144" x2="1140" y2="672" stroke="#dadce0" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="110" y1="182" x2="368" y2="182" stroke="#34A853" stroke-width="1.8" marker-end="url(#ar-gateway)"/>
  <text x="239" y="174" text-anchor="middle" font-size="11.5" fill="#3c4043">POST /api/account/deactivate</text>
  <circle cx="121" cy="182" r="9.5" fill="#5f6368"/>
  <text x="121" y="186" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">1</text>
  <path d="M368,212 h34 v18 h-34" fill="none" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#ar-grey)"/>
  <text x="410" y="210" font-size="11.5" fill="#3c4043">auth_request /_jwt_verify</text>
  <text x="410" y="224" font-size="10" fill="#80868b">auth.verify introspects the token</text>
  <circle cx="352" cy="218" r="9.5" fill="#5f6368"/>
  <text x="352" y="222" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">2</text>
  <line x1="368" y1="262" x2="625" y2="262" stroke="#EA4335" stroke-width="1.8" marker-end="url(#ar-keycloak)"/>
  <text x="496" y="254" text-anchor="middle" font-size="11.5" fill="#3c4043">adminToken()</text>
  <circle cx="378" cy="262" r="9.5" fill="#5f6368"/>
  <text x="378" y="266" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">3</text>
  <line x1="368" y1="302" x2="625" y2="302" stroke="#EA4335" stroke-width="1.8" marker-end="url(#ar-keycloak)"/>
  <text x="496" y="294" text-anchor="middle" font-size="11.5" fill="#3c4043">does this account have a PASSWORD?</text>
  <text x="496" y="315" text-anchor="middle" font-size="10" fill="#80868b">Google / OTP accounts have none</text>
  <circle cx="378" cy="302" r="9.5" fill="#5f6368"/>
  <text x="378" y="306" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">4</text>
  <line x1="368" y1="342" x2="625" y2="342" stroke="#EA4335" stroke-width="1.8" marker-end="url(#ar-keycloak)"/>
  <text x="496" y="334" text-anchor="middle" font-size="11.5" fill="#3c4043">password users only: enabled=false</text>
  <text x="496" y="355" text-anchor="middle" font-size="10" fill="#80868b">social/OTP stay ENABLED — else permanent lockout</text>
  <circle cx="378" cy="342" r="9.5" fill="#5f6368"/>
  <text x="378" y="346" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">5</text>
  <line x1="368" y1="382" x2="882" y2="382" stroke="#F9AB00" stroke-width="1.8" marker-end="url(#ar-backend)"/>
  <text x="625" y="374" text-anchor="middle" font-size="11.5" fill="#3c4043">POST /internal/customer/status</text>
  <text x="625" y="395" text-anchor="middle" font-size="10" fill="#80868b">private Docker network, no token</text>
  <circle cx="378" cy="382" r="9.5" fill="#5f6368"/>
  <text x="378" y="386" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">6</text>
  <line x1="882" y1="422" x2="1140" y2="422" stroke="#8E24AA" stroke-width="1.8" marker-end="url(#ar-mysql)"/>
  <text x="1011" y="414" text-anchor="middle" font-size="11.5" fill="#3c4043">status = 'deactivated'</text>
  <circle cx="894" cy="422" r="9.5" fill="#5f6368"/>
  <text x="894" y="426" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">7</text>
  <line x1="368" y1="462" x2="110" y2="462" stroke="#9aa0a6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar-grey)"/>
  <text x="239" y="454" text-anchor="middle" font-size="11.5" fill="#3c4043">{"ok":true,"reactivateWith":"login"}</text>
  <circle cx="356" cy="462" r="9.5" fill="#5f6368"/>
  <text x="356" y="466" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">8</text>
  <line x1="110" y1="502" x2="368" y2="502" stroke="#34A853" stroke-width="1.8" marker-end="url(#ar-gateway)"/>
  <text x="239" y="494" text-anchor="middle" font-size="11.5" fill="#3c4043">GET /api/me (next call)</text>
  <circle cx="121" cy="502" r="9.5" fill="#5f6368"/>
  <text x="121" y="506" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">9</text>
  <line x1="882" y1="542" x2="110" y2="542" stroke="#9aa0a6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar-grey)"/>
  <text x="496" y="534" text-anchor="middle" font-size="11.5" fill="#3c4043">403 account_deactivated</text>
  <text x="496" y="555" text-anchor="middle" font-size="10" fill="#80868b">token still valid — app policy refuses</text>
  <circle cx="872" cy="542" r="9.5" fill="#5f6368"/>
  <text x="872" y="546" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">10</text>
  <rect x="602" y="566" width="560" height="26" rx="6" fill="#f8f9fa" stroke="#dadce0"/>
  <text x="882" y="584" text-anchor="middle" font-size="11" fill="#5f6368">Why MySQL and not Keycloak? Social/OTP users have no password to prove ownership with.</text>
</svg>
