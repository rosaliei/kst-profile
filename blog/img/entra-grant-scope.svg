<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" width="1440" height="640"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16161D"/>
    </marker>
    <style>
      .sh  { fill:#16161D; }
      .tb  { font-size:22px; font-weight:700; fill:#16161D; }
      .t   { font-size:18px; fill:#16161D; }
      .sub { font-size:16px; fill:#5A5A66; }
      .arw { stroke:#16161D; stroke-width:3; fill:none; marker-end:url(#ag); }
      .dead{ stroke:#C2352B; stroke-width:4; fill:none; }
    </style>
  </defs>

  <rect width="1440" height="640" fill="#FFF6E9"/>

  <!-- LEFT: broken -->
  <rect x="58" y="58" width="640" height="510" rx="20" class="sh"/>
  <rect x="50" y="50" width="640" height="510" rx="20" fill="#FFF0EE" stroke="#16161D" stroke-width="3"/>
  <rect x="80" y="80" width="330" height="42" rx="21" fill="#FF7A45" stroke="#16161D" stroke-width="3"/>
  <text x="245" y="109" text-anchor="middle" font-size="18" font-weight="700" fill="#16161D">grant scope: this</text>
  <text x="80" y="152" class="t">"Give the role my org, and let them connect."</text>

  <rect x="110" y="196" width="500" height="76" rx="16" fill="#6C5CE7" stroke="#16161D" stroke-width="3"/>
  <text x="360" y="226" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">org · kst-org</text>
  <text x="360" y="252" text-anchor="middle" font-size="15" fill="#EDE9FF">role applies here, and only here</text>

  <path class="dead" d="M360 276 L 360 334" stroke-dasharray="8 6"/>
  <circle cx="360" cy="305" r="19" fill="#FFF0EE" stroke="#C2352B" stroke-width="4"/>
  <line x1="351" y1="296" x2="369" y2="314" stroke="#C2352B" stroke-width="4" stroke-linecap="round"/>
  <line x1="369" y1="296" x2="351" y2="314" stroke="#C2352B" stroke-width="4" stroke-linecap="round"/>

  <rect x="110" y="352" width="500" height="90" rx="16" fill="#FFFDF7" stroke="#16161D" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="360" y="384" text-anchor="middle" class="t" font-weight="700">project · profile-app</text>
  <text x="360" y="412" text-anchor="middle" class="sub">where the targets actually live</text>

  <rect x="110" y="470" width="500" height="62" rx="14" fill="#FFD24C" stroke="#16161D" stroke-width="3"/>
  <text x="360" y="497" text-anchor="middle" class="t" font-weight="700">Result: zero targets listed</text>
  <text x="360" y="520" text-anchor="middle" class="sub">login works, authorization does not</text>

  <!-- RIGHT: fixed -->
  <rect x="758" y="58" width="640" height="510" rx="20" class="sh"/>
  <rect x="750" y="50" width="640" height="510" rx="20" fill="#EAFBF5" stroke="#16161D" stroke-width="3"/>
  <rect x="780" y="80" width="420" height="42" rx="21" fill="#2EC4A6" stroke="#16161D" stroke-width="3"/>
  <text x="990" y="109" text-anchor="middle" font-size="18" font-weight="700" fill="#0C3B33">grant scope: this, children</text>
  <text x="780" y="152" class="t">Same role. One more grant scope.</text>

  <rect x="810" y="196" width="500" height="76" rx="16" fill="#6C5CE7" stroke="#16161D" stroke-width="3"/>
  <text x="1060" y="226" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">org · kst-org</text>
  <text x="1060" y="252" text-anchor="middle" font-size="15" fill="#EDE9FF">role applies here…</text>

  <path class="arw" d="M1060 276 L 1060 344"/>
  <text x="1082" y="316" class="sub">…and downward</text>

  <rect x="810" y="352" width="500" height="90" rx="16" fill="#FFFDF7" stroke="#16161D" stroke-width="3"/>
  <text x="1060" y="384" text-anchor="middle" class="t" font-weight="700">project · profile-app</text>
  <text x="1060" y="412" text-anchor="middle" class="sub">targets now in scope</text>

  <rect x="810" y="470" width="500" height="62" rx="14" fill="#2EC4A6" stroke="#16161D" stroke-width="3"/>
  <text x="1060" y="497" text-anchor="middle" class="t" font-weight="700">Result: the two targets appear</text>
  <text x="1060" y="520" text-anchor="middle" font-size="16" fill="#0C3B33">and connect succeeds</text>

  <text x="50" y="612" class="sub">The role was never wrong. It was applied to the scope that holds identities, not the scope that holds resources.</text>
</svg>
