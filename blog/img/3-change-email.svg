<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="872" viewBox="0 0 1250 872" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar-browser" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#4285F4"/></marker>
    <marker id="ar-gateway" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#34A853"/></marker>
    <marker id="ar-keycloak" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#EA4335"/></marker>
    <marker id="ar-backend" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#F9AB00"/></marker>
    <marker id="ar-mysql" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#8E24AA"/></marker>
    <marker id="ar-mail" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#00838F"/></marker>
    <marker id="ar-grey" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#9aa0a6"/></marker>
  </defs>
  <rect x="0" y="0" width="1250" height="872" fill="#ffffff"/>
  <text x="625" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">Flow 3 — Change e-mail (verified, two-step)</text>
  <text x="625" y="64" text-anchor="middle" font-size="13" fill="#666">E-mail is the login credential, so it is parked until a code sent TO THE NEW ADDRESS comes back. Username moves with it.</text>
  <rect x="22" y="86" width="176" height="58" rx="10" fill="#E8F0FE" stroke="#4285F4"/>
  <text x="110" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#174ea6">BROWSER</text>
  <text x="110" y="127" text-anchor="middle" font-size="10.5" fill="#3c4043">React SPA + sessionStorage</text>
  <line x1="110" y1="144" x2="110" y2="832" stroke="#dadce0" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="280" y="86" width="176" height="58" rx="10" fill="#E6F4EA" stroke="#34A853"/>
  <text x="368" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#137333">API GATEWAY</text>
  <text x="368" y="127" text-anchor="middle" font-size="10.5" fill="#3c4043">nginx + njs</text>
  <line x1="368" y1="144" x2="368" y2="832" stroke="#dadce0" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="537" y="86" width="176" height="58" rx="10" fill="#FCE8E6" stroke="#EA4335"/>
  <text x="625" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a50e0e">KEYCLOAK</text>
  <text x="625" y="127" text-anchor="middle" font-size="10.5" fill="#3c4043">identity + credentials</text>
  <line x1="625" y1="144" x2="625" y2="832" stroke="#dadce0" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="794" y="86" width="176" height="58" rx="10" fill="#E0F7FA" stroke="#00838F"/>
  <text x="882" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#006064">MAILBOX</text>
  <text x="882" y="127" text-anchor="middle" font-size="10.5" fill="#3c4043">the user's inbox</text>
  <line x1="882" y1="144" x2="882" y2="832" stroke="#dadce0" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="1052" y="86" width="176" height="58" rx="10" fill="#FEF7E0" stroke="#F9AB00"/>
  <text x="1140" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b06000">SHOP-SERVICE</text>
  <text x="1140" y="127" text-anchor="middle" font-size="10.5" fill="#3c4043">Node backend</text>
  <line x1="1140" y1="144" x2="1140" y2="832" stroke="#dadce0" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="110" y1="182" x2="368" y2="182" stroke="#34A853" stroke-width="1.8" marker-end="url(#ar-gateway)"/>
  <text x="239" y="174" text-anchor="middle" font-size="11.5" fill="#3c4043">POST /api/account/email/request</text>
  <text x="239" y="195" text-anchor="middle" font-size="10" fill="#80868b">{ "email": "new@example.com" }</text>
  <circle cx="121" cy="182" r="9.5" fill="#5f6368"/>
  <text x="121" y="186" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">1</text>
  <path d="M368,212 h34 v18 h-34" fill="none" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#ar-grey)"/>
  <text x="410" y="210" font-size="11.5" fill="#3c4043">auth_request /_jwt_verify</text>
  <text x="410" y="224" font-size="10" fill="#80868b">auth.verify introspects → sets $auth_sub</text>
  <circle cx="352" cy="218" r="9.5" fill="#5f6368"/>
  <text x="352" y="222" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">2</text>
  <line x1="368" y1="262" x2="625" y2="262" stroke="#EA4335" stroke-width="1.8" marker-end="url(#ar-keycloak)"/>
  <text x="496" y="254" text-anchor="middle" font-size="11.5" fill="#3c4043">relayEmailChange("request")</text>
  <text x="496" y="275" text-anchor="middle" font-size="10" fill="#80868b">forwards the caller’s own Bearer token</text>
  <circle cx="378" cy="262" r="9.5" fill="#5f6368"/>
  <text x="378" y="266" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">3</text>
  <path d="M625,292 h34 v18 h-34" fill="none" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#ar-grey)"/>
  <text x="667" y="290" font-size="11.5" fill="#3c4043">park pending address + hashed code</text>
  <text x="667" y="304" font-size="10" fill="#80868b">account still has the OLD e-mail</text>
  <circle cx="609" cy="298" r="9.5" fill="#5f6368"/>
  <text x="609" y="302" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">4</text>
  <line x1="625" y1="342" x2="882" y2="342" stroke="#00838F" stroke-width="1.8" marker-end="url(#ar-mail)"/>
  <text x="754" y="334" text-anchor="middle" font-size="11.5" fill="#3c4043">code mailed to the NEW address</text>
  <circle cx="636" cy="342" r="9.5" fill="#5f6368"/>
  <text x="636" y="346" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">5</text>
  <line x1="625" y1="382" x2="110" y2="382" stroke="#9aa0a6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar-grey)"/>
  <text x="368" y="374" text-anchor="middle" font-size="11.5" fill="#3c4043">{"status":"code_sent","ttl":600}</text>
  <circle cx="614" cy="382" r="9.5" fill="#5f6368"/>
  <text x="614" y="386" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">6</text>
  <rect x="425" y="406" width="400" height="26" rx="6" fill="#f8f9fa" stroke="#dadce0"/>
  <text x="625" y="424" text-anchor="middle" font-size="11" fill="#5f6368">— nothing has changed on the account yet —</text>
  <line x1="110" y1="462" x2="368" y2="462" stroke="#34A853" stroke-width="1.8" marker-end="url(#ar-gateway)"/>
  <text x="239" y="454" text-anchor="middle" font-size="11.5" fill="#3c4043">POST /api/account/email/confirm</text>
  <text x="239" y="475" text-anchor="middle" font-size="10" fill="#80868b">{ "code": "241137" }</text>
  <circle cx="121" cy="462" r="9.5" fill="#5f6368"/>
  <text x="121" y="466" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">7</text>
  <line x1="368" y1="502" x2="625" y2="502" stroke="#EA4335" stroke-width="1.8" marker-end="url(#ar-keycloak)"/>
  <text x="496" y="494" text-anchor="middle" font-size="11.5" fill="#3c4043">relayEmailChange("confirm")</text>
  <circle cx="378" cy="502" r="9.5" fill="#5f6368"/>
  <text x="378" y="506" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">8</text>
  <path d="M625,532 h34 v18 h-34" fill="none" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#ar-grey)"/>
  <text x="667" y="530" font-size="11.5" fill="#3c4043">promote: email AND username</text>
  <text x="667" y="544" font-size="10" fill="#80868b">social links cut; kc_sub unchanged</text>
  <circle cx="609" cy="538" r="9.5" fill="#5f6368"/>
  <text x="609" y="542" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">9</text>
  <line x1="625" y1="582" x2="882" y2="582" stroke="#00838F" stroke-width="1.8" marker-end="url(#ar-mail)"/>
  <text x="754" y="574" text-anchor="middle" font-size="11.5" fill="#3c4043">notice to the OLD address</text>
  <circle cx="636" cy="582" r="9.5" fill="#5f6368"/>
  <text x="636" y="586" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">10</text>
  <line x1="625" y1="622" x2="110" y2="622" stroke="#9aa0a6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar-grey)"/>
  <text x="368" y="614" text-anchor="middle" font-size="11.5" fill="#3c4043">200 {"email":"new@example.com"}</text>
  <circle cx="614" cy="622" r="9.5" fill="#5f6368"/>
  <text x="614" y="626" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">11</text>
  <line x1="110" y1="662" x2="625" y2="662" stroke="#EA4335" stroke-width="1.8" marker-end="url(#ar-keycloak)"/>
  <text x="368" y="654" text-anchor="middle" font-size="11.5" fill="#3c4043">REFRESH token</text>
  <text x="368" y="675" text-anchor="middle" font-size="10" fill="#80868b">Google → direct;  OTP → via /auth-api/refresh</text>
  <circle cx="121" cy="662" r="9.5" fill="#5f6368"/>
  <text x="121" y="666" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">12</text>
  <line x1="110" y1="702" x2="1140" y2="702" stroke="#F9AB00" stroke-width="1.8" marker-end="url(#ar-backend)"/>
  <text x="625" y="694" text-anchor="middle" font-size="11.5" fill="#3c4043">GET /api/me with the new token</text>
  <circle cx="121" cy="702" r="9.5" fill="#5f6368"/>
  <text x="121" y="706" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">13</text>
  <path d="M1140,732 h34 v18 h-34" fill="none" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#ar-grey)"/>
  <text x="1182" y="730" font-size="11.5" fill="#3c4043">ensureCustomer() re-mirrors the e-mail into MySQL</text>
  <text x="1182" y="744" font-size="10" fill="#80868b">same kc_sub → orders + cart survive</text>
  <circle cx="1124" cy="738" r="9.5" fill="#5f6368"/>
  <text x="1124" y="742" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">14</text>
</svg>
