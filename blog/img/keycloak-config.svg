<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="830" viewBox="0 0 1250 830" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7.5,3 L0,6 Z" fill="#5f6368"/></marker>
  </defs>
  <rect width="1250" height="830" fill="#ffffff"/>
  <text x="625" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">Keycloak configuration — clients, mappers and roles</text>
  <text x="625" y="66" text-anchor="middle" font-size="13" fill="#666">Two clients, deliberately different: one is a public browser client, the other holds the secret. From keycloak/realm-demo.json</text>
  <rect x="70" y="88" width="1110" height="56" rx="10" fill="#E6F4EA" stroke="#34A853"/>
  <text x="94" y="112" font-size="15" fill="#137333" text-anchor="start" font-weight="700">REALM   demo</text>
  <text x="94" y="132" font-size="11.5" fill="#137333" text-anchor="start" font-weight="400">realm roles:  admin  ·  user        (a user gets its roles from the token claim realm_access.roles)</text>
  <rect x="70" y="176" width="525" height="322" rx="10" fill="#E8F0FE" stroke="#4285F4"/>
  <text x="92" y="206" font-size="16" fill="#174ea6" text-anchor="start" font-weight="700">web-frontend</text>
  <text x="92" y="226" font-size="11" fill="#174ea6" text-anchor="start" font-weight="400">PUBLIC client — ships in the browser, so it can hold no secret</text>
  <text x="92" y="254" font-size="11" fill="#5f6368" text-anchor="start" font-weight="400">Client authentication</text>
  <text x="270" y="254" font-size="11" fill="#202124" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">OFF  (public)</text>
  <text x="92" y="276" font-size="11" fill="#5f6368" text-anchor="start" font-weight="400">Standard flow</text>
  <text x="270" y="276" font-size="11" fill="#202124" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ON   — Authorization Code + PKCE</text>
  <text x="92" y="298" font-size="11" fill="#5f6368" text-anchor="start" font-weight="400">Direct access grants</text>
  <text x="270" y="298" font-size="11" fill="#202124" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">OFF  — cannot do password/OTP grants</text>
  <text x="92" y="320" font-size="11" fill="#5f6368" text-anchor="start" font-weight="400">Service accounts</text>
  <text x="270" y="320" font-size="11" fill="#202124" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">OFF</text>
  <text x="92" y="342" font-size="11" fill="#5f6368" text-anchor="start" font-weight="400">Valid redirect URIs</text>
  <text x="270" y="342" font-size="11" fill="#202124" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">${PUBLIC_ORIGIN}/*</text>
  <text x="92" y="364" font-size="11" fill="#5f6368" text-anchor="start" font-weight="400">Web origins</text>
  <text x="270" y="364" font-size="11" fill="#202124" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">${PUBLIC_ORIGIN}</text>
  <rect x="90" y="402" width="485" height="76" rx="8" fill="#f8f9fa" stroke="#dadce0"/>
  <text x="104" y="424" font-size="10.5" fill="#5f6368" text-anchor="start" font-weight="700">USED BY  — the browser, directly:</text>
  <text x="104" y="442" font-size="10.5" fill="#3c4043" text-anchor="start" font-weight="400">• Google / social login  (kc_idp_hint + PKCE)</text>
  <text x="104" y="458" font-size="10.5" fill="#3c4043" text-anchor="start" font-weight="400">• token refresh and RP-initiated logout for those sessions</text>
  <rect x="655" y="176" width="525" height="322" rx="10" fill="#FCE8E6" stroke="#EA4335"/>
  <text x="677" y="206" font-size="16" fill="#a50e0e" text-anchor="start" font-weight="700">api-gateway</text>
  <text x="677" y="226" font-size="11" fill="#a50e0e" text-anchor="start" font-weight="400">CONFIDENTIAL client — the secret never leaves the server</text>
  <text x="677" y="254" font-size="11" fill="#5f6368" text-anchor="start" font-weight="400">Client authentication</text>
  <text x="855" y="254" font-size="11" fill="#202124" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ON   secret → KC_CLIENT_SECRET</text>
  <text x="677" y="276" font-size="11" fill="#5f6368" text-anchor="start" font-weight="400">Standard flow</text>
  <text x="855" y="276" font-size="11" fill="#202124" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">OFF  — never used in a browser</text>
  <text x="677" y="298" font-size="11" fill="#5f6368" text-anchor="start" font-weight="400">Direct access grants</text>
  <text x="855" y="298" font-size="11" fill="#202124" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ON   — the e-mail OTP + password login</text>
  <text x="677" y="320" font-size="11" fill="#5f6368" text-anchor="start" font-weight="400">Service accounts</text>
  <text x="855" y="320" font-size="11" fill="#202124" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ON   — for Admin API calls</text>
  <text x="677" y="342" font-size="11" fill="#5f6368" text-anchor="start" font-weight="400">Valid redirect URIs</text>
  <text x="855" y="342" font-size="11" fill="#202124" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">—    (no browser redirect)</text>
  <text x="677" y="364" font-size="11" fill="#5f6368" text-anchor="start" font-weight="400">Web origins</text>
  <text x="855" y="364" font-size="11" fill="#202124" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">—</text>
  <rect x="675" y="402" width="485" height="76" rx="8" fill="#f8f9fa" stroke="#dadce0"/>
  <text x="689" y="424" font-size="10.5" fill="#5f6368" text-anchor="start" font-weight="700">USED BY  — njs inside nginx, server-side only:</text>
  <text x="689" y="442" font-size="10.5" fill="#3c4043" text-anchor="start" font-weight="400">• /auth-api/*  — otp/send, otp/verify, login, refresh, logout</text>
  <text x="689" y="458" font-size="10.5" fill="#3c4043" text-anchor="start" font-weight="400">• /api/account/*  — name, deactivate, reactivate, delete</text>
  <rect x="655" y="520" width="525" height="86" rx="10" fill="#FEF7E0" stroke="#F9AB00"/>
  <text x="677" y="544" font-size="12" fill="#b06000" text-anchor="start" font-weight="700">SERVICE ACCOUNT ROLES  (api-gateway only)</text>
  <text x="677" y="566" font-size="11.5" fill="#202124" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">client realm-management  →  manage-users , view-users</text>
  <text x="677" y="586" font-size="10.5" fill="#5f6368" text-anchor="start" font-weight="400">Without these the Admin API calls 403: create user, change name,</text>
  <text x="677" y="600" font-size="10.5" fill="#5f6368" text-anchor="start" font-weight="400">enable/disable, delete. adminToken() uses client_credentials.</text>
  <rect x="70" y="520" width="525" height="86" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-dasharray="5 4"/>
  <text x="92" y="544" font-size="12" fill="#5f6368" text-anchor="start" font-weight="700">PROTOCOL MAPPER  —  on BOTH clients</text>
  <text x="92" y="566" font-size="11.5" fill="#202124" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">aud-api-gateway   (oidc-audience-mapper)</text>
  <text x="92" y="586" font-size="10.5" fill="#5f6368" text-anchor="start" font-weight="400">adds  aud: "api-gateway"  to the ACCESS token (not the id token), so a</text>
  <text x="92" y="600" font-size="10.5" fill="#5f6368" text-anchor="start" font-weight="400">token minted by either client is addressed to the same API.</text>
  <rect x="70" y="636" width="1110" height="118" rx="10" fill="#E6F4EA" stroke="#34A853"/>
  <text x="92" y="662" font-size="12" fill="#137333" text-anchor="start" font-weight="700">WHAT THE GATEWAY ACCEPTS</text>
  <text x="92" y="686" font-size="12" fill="#202124" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">map $host $oidc_client_id { default "web-frontend api-gateway"; }</text>
  <text x="92" y="708" font-size="10.5" fill="#5f6368" text-anchor="start" font-weight="400">auth.verify checks the token's  azp  against this allowlist. A token issued to any OTHER client in the realm —</text>
  <text x="92" y="723" font-size="10.5" fill="#5f6368" text-anchor="start" font-weight="400">admin-cli, a partner integration, a forgotten test client — is rejected with client_mismatch. This is the check</text>
  <text x="92" y="738" font-size="10.5" fill="#5f6368" text-anchor="start" font-weight="400">introspection does NOT do for you: it only answers "is this token active", not "was it meant for us".</text>
  <line x1="332" y1="606" x2="332" y2="632" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="917" y1="606" x2="917" y2="632" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
