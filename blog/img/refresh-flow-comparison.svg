<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="660" viewBox="0 0 1060 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8E24AA"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="530" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">Token Refresh — same app, two paths</text>
  <text x="530" y="66" text-anchor="middle" font-size="14" fill="#666">The refresh follows the client that issued the token. A secret can never reach the browser.</text>

  <!-- ===================== LEFT PANEL ===================== -->
  <rect x="30" y="90" width="490" height="470" rx="14" fill="#F7FAFF" stroke="#c9d6e5"/>
  <text x="275" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">① Email OTP / Password</text>
  <text x="275" y="144" text-anchor="middle" font-size="12.5" fill="#b3261e">confidential client &#8220;api-gateway&#8221; — refresh NEEDS a secret</text>

  <!-- Browser -->
  <rect x="200" y="170" width="200" height="54" rx="10" fill="#E8F0FE" stroke="#4285F4"/>
  <text x="300" y="197" text-anchor="middle" font-size="14" font-weight="700" fill="#174ea6">Browser (SPA)</text>
  <text x="300" y="214" text-anchor="middle" font-size="11" fill="#3c4043">holds refresh_token</text>

  <!-- arrow down 1 -->
  <line x1="300" y1="224" x2="300" y2="290" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="312" y="252" font-size="11.5" fill="#333">POST /auth-api/refresh</text>
  <text x="312" y="268" font-size="11.5" fill="#333">{ refresh_token }</text>

  <!-- njs gateway -->
  <rect x="200" y="292" width="200" height="60" rx="10" fill="#E0F2F1" stroke="#00897B"/>
  <text x="300" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#00695C">njs · api-gateway</text>
  <text x="300" y="334" text-anchor="middle" font-size="11" fill="#3c4043">server-side — holds client_secret</text>
  <rect x="352" y="298" width="42" height="18" rx="9" fill="#b3261e"/>
  <text x="373" y="311" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">SECRET</text>

  <!-- arrow down 2 -->
  <line x1="300" y1="352" x2="300" y2="420" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="312" y="378" font-size="11.5" fill="#333">grant_type=refresh_token</text>
  <text x="312" y="394" font-size="11.5" fill="#333">client_id + client_secret</text>
  <text x="312" y="410" font-size="11.5" fill="#333">+ refresh_token</text>

  <!-- Keycloak -->
  <rect x="200" y="422" width="200" height="54" rx="10" fill="#EDE7F6" stroke="#673AB7"/>
  <text x="300" y="449" text-anchor="middle" font-size="14" font-weight="700" fill="#4527A0">Keycloak</text>
  <text x="300" y="466" text-anchor="middle" font-size="11" fill="#3c4043">token endpoint</text>

  <!-- return dashed arrow (left rail) -->
  <path d="M200,449 L110,449 L110,197 L200,197" fill="none" stroke="#8E24AA" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowBack)"/>
  <text x="118" y="330" font-size="11.5" fill="#8E24AA" transform="rotate(-90 118 330)" text-anchor="middle">new access + refresh token</text>

  <!-- ===================== RIGHT PANEL ===================== -->
  <rect x="540" y="90" width="490" height="470" rx="14" fill="#F7FBF8" stroke="#c9e5d1"/>
  <text x="785" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">② Google / Social</text>
  <text x="785" y="144" text-anchor="middle" font-size="12.5" fill="#0b8043">public client &#8220;web-frontend&#8221; + PKCE — NO secret</text>

  <!-- Browser -->
  <rect x="685" y="205" width="200" height="60" rx="10" fill="#E8F0FE" stroke="#4285F4"/>
  <text x="785" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#174ea6">Browser (SPA)</text>
  <text x="785" y="248" text-anchor="middle" font-size="11" fill="#3c4043">holds refresh_token · no secret</text>

  <!-- arrow down -->
  <line x1="785" y1="265" x2="785" y2="380" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="797" y="300" font-size="11.5" fill="#333">grant_type=refresh_token</text>
  <text x="797" y="316" font-size="11.5" fill="#333">client_id=web-frontend</text>
  <text x="797" y="332" font-size="11.5" fill="#333">+ refresh_token</text>
  <text x="797" y="352" font-size="11.5" font-weight="700" fill="#0b8043">(no client_secret)</text>

  <!-- Keycloak -->
  <rect x="685" y="382" width="200" height="54" rx="10" fill="#EDE7F6" stroke="#673AB7"/>
  <text x="785" y="409" text-anchor="middle" font-size="14" font-weight="700" fill="#4527A0">Keycloak</text>
  <text x="785" y="426" text-anchor="middle" font-size="11" fill="#3c4043">token endpoint (direct)</text>

  <!-- return dashed arrow -->
  <path d="M685,409 L600,409 L600,235 L685,235" fill="none" stroke="#8E24AA" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowBack)"/>
  <text x="608" y="322" font-size="11.5" fill="#8E24AA" transform="rotate(-90 608 322)" text-anchor="middle">new access + refresh token</text>

  <!-- key difference note -->
  <text x="785" y="492" text-anchor="middle" font-size="12" fill="#555">One less hop — nothing secret to protect,</text>
  <text x="785" y="510" text-anchor="middle" font-size="12" fill="#555">so the browser talks to Keycloak itself.</text>

  <!-- ===================== BOTTOM CALLOUT ===================== -->
  <rect x="30" y="586" width="1000" height="58" rx="12" fill="#FFF4E5" stroke="#F4A100"/>
  <text x="530" y="610" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a5a00">Why the paths differ: the client secret must never reach the browser.</text>
  <text x="530" y="630" text-anchor="middle" font-size="12.5" fill="#8a5a00">Confidential client (OTP/password) → can only refresh server-side, through njs.   Public PKCE client (social) → no secret, refreshes Keycloak directly.</text>
</svg>
