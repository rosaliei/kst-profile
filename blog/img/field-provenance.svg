<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1180" width="1520" height="1180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6875"/>
    </marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14a3a5"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f8cff"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e08c14"/>
    </marker>
    <style>
      .card   { fill:#ffffff; stroke:#d8e0e6; stroke-width:1.5; }
      .tok    { fill:#f2f7ff; stroke:#4f8cff; stroke-width:1.5; }
      .usr    { fill:#fff8f0; stroke:#e08c14; stroke-width:1.5; }
      .gen    { fill:#f4fbfb; stroke:#14a3a5; stroke-width:1.5; }
      .prop   { fill:#fbfcfd; stroke:#c9d4dc; stroke-width:1.5; stroke-dasharray:6 4; }
      .hApp   { fill:#14a3a5; }
      .t      { font-size:15px; font-weight:700; fill:#23303e; }
      .zone   { font-size:14px; font-weight:700; fill:#23303e; }
      .sub    { font-size:11.5px; fill:#8a97a5; }
      .body   { font-size:12px; fill:#3c4a58; }
      .col    { font-size:12px; fill:#23303e; font-family:ui-monospace,'SF Mono',Menlo,monospace; }
      .mono   { font-size:11.5px; fill:#3c4a58; font-family:ui-monospace,'SF Mono',Menlo,monospace; }
      .msm    { font-size:10.5px; fill:#5a6875; font-family:ui-monospace,'SF Mono',Menlo,monospace; }
      .hTxt   { font-size:13px; font-weight:700; fill:#ffffff; font-family:ui-monospace,Menlo,monospace; }
      .badge  { font-size:9.5px; font-weight:700; font-family:ui-monospace,Menlo,monospace; }
      .lbl    { font-size:11px; fill:#5a6875; }
      .lblb   { font-size:11.5px; font-weight:600; fill:#3c4a58; }
      .fl     { stroke:#5a6875; stroke-width:1.8; fill:none; marker-end:url(#a); }
      .flT    { stroke:#14a3a5; stroke-width:2.2; fill:none; marker-end:url(#aT); }
      .flB    { stroke:#4f8cff; stroke-width:2.2; fill:none; marker-end:url(#aB); }
      .flG    { stroke:#e08c14; stroke-width:2.2; fill:none; marker-end:url(#aG); }
      .pill   { font-size:10px; font-weight:700; }
    </style>
  </defs>

  <rect width="1520" height="1180" fill="#ffffff"/>

  <text x="40" y="44" font-size="24" font-weight="700" fill="#23303e">Where does each field come from?</text>
  <text x="40" y="68" font-size="13.5" fill="#8a97a5">The token stays small. Anything not needed for authorization is filled in by the user and stored in your database.</text>

  <!-- ============ the three sources ============ -->
  <rect class="tok" x="40" y="96" width="150" height="30" rx="15"/>
  <text class="pill" x="62" y="115" fill="#4f8cff">■ FROM THE TOKEN</text>
  <rect class="usr" x="206" y="96" width="182" height="30" rx="15"/>
  <text class="pill" x="228" y="115" fill="#b06a00">■ TYPED BY THE USER</text>
  <rect class="gen" x="404" y="96" width="176" height="30" rx="15"/>
  <text class="pill" x="426" y="115" fill="#0e8486">■ GENERATED BY THE DB</text>

  <!-- ============ PANEL 1: the customer row, colour-coded by source ============ -->
  <text class="zone" x="40" y="168">1 · The customer row — every column tagged with its source</text>

  <rect class="card" x="40" y="184" width="620" height="298" rx="10"/>
  <rect class="hApp" x="40" y="184" width="620" height="28" rx="10"/>
  <rect class="hApp" x="40" y="202" width="620" height="10"/>
  <text class="hTxt" x="58" y="203">customer   (MySQL — schema “shop”)</text>

  <!-- column rows -->
  <rect class="gen" x="58" y="228" width="24" height="18" rx="4"/>
  <text class="badge" x="63" y="241" fill="#0e8486">db</text>
  <text class="col"  x="94" y="242">id</text>
  <text class="sub"  x="300" y="242">BIGINT auto-increment — your own primary key</text>

  <rect class="tok" x="58" y="258" width="24" height="18" rx="4"/>
  <text class="badge" x="61" y="271" fill="#4f8cff">tok</text>
  <text class="col"  x="94" y="272">kc_sub</text>
  <text class="sub"  x="300" y="272">the token's `sub` claim — the identity link</text>

  <rect class="tok" x="58" y="288" width="24" height="18" rx="4"/>
  <text class="badge" x="61" y="301" fill="#4f8cff">tok</text>
  <text class="col"  x="94" y="302">email</text>
  <text class="sub"  x="300" y="302">the token's `email` claim (small, already there)</text>

  <rect class="gen" x="58" y="318" width="24" height="18" rx="4"/>
  <text class="badge" x="63" y="331" fill="#0e8486">app</text>
  <text class="col"  x="94" y="332">profile_completed</text>
  <text class="sub"  x="300" y="332">onboarding gate — set once the user finishes onboarding</text>

  <rect class="usr" x="58" y="348" width="24" height="18" rx="4"/>
  <text class="badge" x="62" y="361" fill="#b06a00">usr</text>
  <text class="col"  x="94" y="362">phone</text>
  <text class="sub"  x="300" y="362">user profile — never in the token (display name is NOT here → Keycloak)</text>

  <rect class="usr" x="58" y="378" width="24" height="18" rx="4"/>
  <text class="badge" x="62" y="391" fill="#b06a00">usr</text>
  <text class="col"  x="94" y="392">address</text>
  <text class="sub"  x="300" y="392">user profile — never in the token</text>

  <rect class="usr" x="58" y="408" width="24" height="18" rx="4"/>
  <text class="badge" x="62" y="421" fill="#b06a00">usr</text>
  <text class="col"  x="94" y="422">preferences</text>
  <text class="sub"  x="300" y="422">JSON bag for the rest — never in the token</text>

  <rect class="gen" x="58" y="438" width="24" height="18" rx="4"/>
  <text class="badge" x="63" y="451" fill="#0e8486">db</text>
  <text class="col"  x="94" y="452">created_at · last_seen_at</text>
  <text class="sub"  x="300" y="452">timestamps set by MySQL automatically</text>

  <!-- the token, small -->
  <rect class="tok" x="700" y="184" width="360" height="150" rx="10"/>
  <text class="lblb" x="720" y="208" fill="#4f8cff">the access token stays small</text>
  <text class="msm" x="720" y="230">{</text>
  <text class="msm" x="736" y="248">"sub":   "88aa71ad-10bd-…",</text>
  <text class="msm" x="736" y="266">"email": "sam@example.com",</text>
  <text class="msm" x="736" y="284">"azp":   "api-gateway",</text>
  <text class="msm" x="736" y="302">"realm_access": { roles }</text>
  <text class="msm" x="720" y="320">}   ← only what njs needs to say yes/no</text>

  <!-- the rule -->
  <rect class="prop" x="700" y="352" width="360" height="130" rx="10"/>
  <text class="lblb" x="720" y="376">The rule</text>
  <text class="body" x="720" y="398">A value belongs in the token ONLY if the</text>
  <text class="body" x="720" y="416">gateway must use it to authorize EVERY</text>
  <text class="body" x="720" y="434">request (sub, roles, azp, iss, exp).</text>
  <text class="body" x="720" y="456">Everything else → the database, so the token</text>
  <text class="body" x="720" y="474">never grows no matter how rich the profile.</text>

  <!-- side note -->
  <rect class="card" x="1084" y="184" width="396" height="298" rx="10"/>
  <text class="lblb" x="1104" y="208">Why not just add it to the token?</text>
  <text class="body" x="1104" y="230">The token is sent on EVERY API call, lives</text>
  <text class="body" x="1104" y="248">in the browser, and rides in every header.</text>
  <text class="body" x="1104" y="266">Each extra claim multiplies across thousands</text>
  <text class="body" x="1104" y="284">of requests. A DB column is read only when</text>
  <text class="body" x="1104" y="302">you actually need it.</text>
  <text class="lblb" x="1104" y="336">Also avoid…</text>
  <text class="body" x="1104" y="358">storing profile fields as Keycloak user</text>
  <text class="body" x="1104" y="376">attributes and mapping them into the token.</text>
  <text class="body" x="1104" y="394">That bloats the JWT one claim at a time and</text>
  <text class="body" x="1104" y="412">puts business data in the identity provider.</text>
  <text class="body" x="1104" y="430">Keycloak attributes are for identity only</text>
  <text class="body" x="1104" y="448">(e.g. the OTP hash) — not shopping data.</text>

  <!-- ============ PANEL 2: WRITE — how phone gets its value ============ -->
  <text class="zone" x="40" y="536">2 · How phone gets a value when it is NOT in the token  (the user provides it → your DB)</text>

  <rect class="usr" x="40" y="556" width="250" height="150" rx="10"/>
  <text class="t"    x="58" y="582">① User</text>
  <text class="body" x="58" y="604">types their phone in the</text>
  <text class="body" x="58" y="622">profile screen</text>
  <text class="mono" x="58" y="648">PUT /api/me/profile</text>
  <text class="mono" x="58" y="668">{ "phone":</text>
  <text class="mono" x="58" y="686">   "+95 9 123 456" }</text>

  <rect class="card" x="330" y="556" width="250" height="150" rx="10"/>
  <text class="t"    x="348" y="582">② nginx + njs</text>
  <text class="body" x="348" y="604">verifies the token, adds</text>
  <text class="body" x="348" y="622">the identity headers</text>
  <text class="mono" x="348" y="648">claims.sub: 88aa…</text>
  <text class="sub"  x="348" y="672">the display name is in the</text>
  <text class="sub"  x="348" y="688">body — njs doesn't touch it</text>

  <rect class="card" x="620" y="556" width="270" height="150" rx="10"/>
  <text class="t"    x="638" y="582">③ shop-service</text>
  <text class="body" x="638" y="604">identifies the row by the</text>
  <text class="body" x="638" y="622">verified sub, saves the</text>
  <text class="body" x="638" y="640">phone from the body</text>
  <text class="msm"  x="638" y="666">UPDATE customer</text>
  <text class="msm"  x="638" y="684">SET phone = ?</text>
  <text class="msm"  x="638" y="700">WHERE kc_sub = ?</text>

  <rect class="gen" x="930" y="556" width="270" height="150" rx="10"/>
  <text class="t"    x="948" y="582">④ customer row</text>
  <text class="msm"  x="948" y="606">kc_sub  88aa…       (token)</text>
  <text class="msm"  x="948" y="626">email   sam@…       (token)</text>
  <text class="msm"  x="948" y="646">phone   +95 9 123…</text>
  <text class="msm"  x="962" y="663">                    (user)</text>
  <text class="sub"  x="948" y="688">one row, values from two sources,</text>
  <text class="sub"  x="948" y="702">token still unchanged in size</text>

  <path class="flG" d="M294,631 L326,631"/>
  <path class="fl"  d="M584,631 L616,631"/>
  <path class="flT" d="M894,631 L926,631"/>

  <text class="sub" x="1224" y="600">The token was never</text>
  <text class="sub" x="1224" y="618">read or changed here —</text>
  <text class="sub" x="1224" y="636">only used to prove WHO</text>
  <text class="sub" x="1224" y="654">is editing (the sub).</text>
  <text class="sub" x="1224" y="672">The phone rides in the</text>
  <text class="sub" x="1224" y="690">request body instead.</text>

  <!-- ============ PANEL 3: READ — GET /api/me merges both ============ -->
  <text class="zone" x="40" y="762">3 · Reading it back — GET /api/me merges identity (token) + profile (database)</text>

  <rect class="tok" x="40" y="782" width="330" height="150" rx="10"/>
  <text class="lblb" x="58" y="806" fill="#4f8cff">from the token (via njs headers)</text>
  <text class="mono" x="58" y="830">displayName = claims.name</text>
  <text class="mono" x="58" y="850">user  = claims.preferred_username</text>
  <text class="mono" x="58" y="870">email = claims.email</text>
  <text class="mono" x="58" y="890">roles = claims.realm_access · sub = claims.sub</text>
  <text class="sub"  x="58" y="916">identity + name — verified, never trusted from client</text>

  <rect class="gen" x="410" y="782" width="330" height="150" rx="10"/>
  <text class="lblb" x="428" y="806" fill="#0e8486">from the customer row (by sub)</text>
  <text class="mono" x="428" y="830">phone       = "+95 9 123 456"</text>
  <text class="mono" x="428" y="850">profileCompleted = true</text>
  <text class="mono" x="428" y="870">cart / orders = …</text>
  <text class="mono" x="428" y="890"> </text>
  <text class="sub"  x="428" y="916">app data — whatever the user has saved</text>

  <rect class="card" x="820" y="782" width="380" height="150" rx="10"/>
  <text class="lblb" x="838" y="806">one merged response to the browser</text>
  <text class="msm" x="838" y="828">{ "user": "sam@example.com",</text>
  <text class="msm" x="838" y="846">  "displayName": "Sam Taylor",  ← token</text>
  <text class="msm" x="838" y="864">  "roles": ["user"],</text>
  <text class="msm" x="838" y="882">  "phone": "…", "profileCompleted": true }</text>
  <text class="sub"  x="838" y="910">the frontend sees one object: identity + name</text>
  <text class="sub"  x="838" y="926">from the token, app data from the DB</text>

  <path class="flB" d="M374,857 L406,857"/>
  <path class="flT" d="M744,857 L816,857"/>

  <!-- ============ decision guide ============ -->
  <text class="zone" x="40" y="988">Which pattern for which field?</text>

  <rect class="card" x="40" y="1006" width="1160" height="150" rx="10"/>
  <line x1="40" y1="1036" x2="1200" y2="1036" stroke="#e6ebef"/>
  <line x1="360" y1="1006" x2="360" y2="1156" stroke="#eef1f4"/>
  <line x1="720" y1="1006" x2="720" y2="1156" stroke="#eef1f4"/>

  <text class="lblb" x="60" y="1028" fill="#4f8cff">Keep in the token</text>
  <text class="body" x="60" y="1058">Only if the gateway must</text>
  <text class="body" x="60" y="1076">decide on it every request.</text>
  <text class="mono" x="60" y="1100">sub · roles · azp</text>
  <text class="mono" x="60" y="1118">tenant_id · plan flag</text>
  <text class="sub"  x="60" y="1140">rare — needs a KC protocol mapper</text>

  <text class="lblb" x="380" y="1028" fill="#b06a00">User provides → your DB</text>
  <text class="body" x="380" y="1058">The default for app data</text>
  <text class="body" x="380" y="1076">that isn't identity.</text>
  <text class="mono" x="380" y="1100">phone · address</text>
  <text class="mono" x="380" y="1118">preferences · cart · orders</text>
  <text class="sub"  x="380" y="1140">token unchanged, no KC change</text>

  <text class="lblb" x="740" y="1028" fill="#0e8486">Identity → Keycloak, in the token</text>
  <text class="body" x="740" y="1058">Who you are and what you're</text>
  <text class="body" x="740" y="1076">called. Edited via the Admin</text>
  <text class="body" x="740" y="1094">API, read from the token.</text>
  <text class="mono" x="740" y="1120">display name · username · email</text>
  <text class="sub"  x="740" y="1142">what this project does for the display name</text>

  <!-- status note -->
  <rect class="prop" x="1224" y="1006" width="256" height="150" rx="10"/>
  <text class="lblb" x="1244" y="1030">Status</text>
  <text class="body" x="1244" y="1052">Display name lives in</text>
  <text class="body" x="1244" y="1070">Keycloak (the `name` claim),</text>
  <text class="body" x="1244" y="1088">edited via /api/account/name.</text>
  <text class="body" x="1244" y="1112">MySQL holds phone +</text>
  <text class="body" x="1244" y="1130">profile_completed, edited</text>
  <text class="body" x="1244" y="1148">via /api/me/profile.</text>
</svg>
